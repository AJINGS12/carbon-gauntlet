# Render blueprint for the API (free tier). The frontend deploys separately on Vercel.
# The hosted demo replays the recorded run (data/traces): no model calls, no wallet, no secrets.
services:
  - type: web
    name: carbon-gauntlet-api
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build -w apps/api
    startCommand: npm start -w apps/api
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DEMO_MODE
        value: "true"
      - key: CHAIN_MODE
        value: mock
      - key: CORS_ORIGIN
        sync: false   # your Vercel URL, e.g. https://carbon-gauntlet.vercel.app
