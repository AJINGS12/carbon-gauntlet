# Render blueprint for the API (free tier). The frontend deploys separately on Vercel.
# The hosted demo replays the recorded run (data/traces): no model calls, no wallet, no secrets.
# Optional live runs (Claude plays now) switch on only when ANTHROPIC_API_KEY and LIVE_RUN_CODE are both set.
services:
  - type: web
    name: carbon-gauntlet-api
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build -w apps/api
    startCommand: npm start -w apps/api
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DEMO_MODE
        value: "true"
      - key: CHAIN_MODE
        value: mock
      - key: CORS_ORIGIN
        sync: false   # your Vercel URL, e.g. https://carbon-gauntlet.vercel.app
      - key: LLM_MODEL
        value: claude-haiku-5-5
      - key: LIVE_RUNS_PER_DAY
        value: "10"
      - key: ANTHROPIC_API_KEY
        sync: false   # optional: leave empty to keep the site replay-only
      - key: LIVE_RUN_CODE
        sync: false   # optional: the access code judges type to start a live run (6+ characters)
      # Saved live runs (docs/records.sql). Without these, runs are kept in memory until a restart.
      - key: SUPABASE_URL
        sync: false   # https://<project>.supabase.co
      - key: SUPABASE_SECRET_KEY
        sync: false   # sb_secret_... (server only, never in the frontend)
      # Anchor each saved run's fingerprint on Base Sepolia (one transaction per run, test ETH only).
      - key: ANCHOR_RUNS
        value: "true"
      - key: REGISTRY_PROTECTED_ADDRESS
        value: "0x0abBb146d782bE58555cC2b63cFe0e14FD234c9F"
      - key: RPC_URL
        value: https://sepolia.base.org
      - key: OPERATOR_PRIVATE_KEY
        sync: false   # the TEST wallet that deployed the registries; anchoring is skipped while empty
